.ib.lg{width:50px;height:50px}.ib.lg svg.i{width:28px;height:28px}

function balCard(l,tot){var ci=0,cn=0,ce=0,cx=0,fi=0,fn=0;S.tx.forEach(function(t){if(t.t=="inc"){if(cnt(t)){ci+=t.amt;cn++}else{fi+=t.amt;fn++}}else if(cnt(t)){ce+=t.amt;cx++}});var ws=wsaved(),fz=frozenSum(),r=function(a,b,c){return '<div class="row" style="padding:5px 0"><span class="sec">'+a+'</span><b style="color:'+(c||"var(--tx)")+'">'+b+'</b></div>'},dp=dupInc();
return '<div class="card"><div class="sec">Общий баланс</div><div class="big">'+fmt(bal())+'</div><div style="margin-top:8px">'+r("Начальный остаток",fmt(S.start))+r("+ Пополнения ("+cn+")",fmt(ci),"var(--ok)")+r("− Расходы ("+cx+")",fmt(ce))+(ws?r("− Отложено в копилки",fmt(ws)):"")+(fz?r("− Заморожено (долг, арест)",fmt(fz)):"")+(fn?r("Ожидается (пока не в балансе)",fmt(fi)):"")+'</div>'+(dp.length?'<div class="sec" style="margin-top:8px;color:var(--bad)">Возможные дубли поступлений: '+dp.join("; ")+'</div>':'')+'<div class="sec" style="margin-top:8px">Баланс считается накопительно за всё время, остаток прошлых месяцев переносится сам. Если сумма не совпадает с банком, проверьте начальный остаток или сверьте баланс.</div><button class="btn ghost" style="margin-top:10px;padding:11px;font-size:14px" onclick="reconSheet()">Сверить с фактическим остатком</button></div>'}
function reconSheet(){sheet('<h3>Сверка баланса</h3><div class="sec" style="margin-bottom:8px">Введите остаток, который у вас на самом деле (по банку и наличным). Приложение покажет разницу с расчётным: '+fmt(bal())+'.</div><input id="ra" inputmode="decimal" placeholder="Фактический остаток, ₽"><button class="btn" onclick="reconCheck()">Сверить</button><button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>')}
function reconCheck(){var v=$("ra").value.trim();if(!v)return toast("Введите остаток");var d=parse(v)-bal();
if(d==0)return sheet('<h3>Баланс сходится ✓</h3><div class="sec">Расчётный остаток совпадает с фактическим.</div><button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Закрыть</button>');
sheet('<h3>Расхождение: '+(d>0?"+":"")+fmt(d)+'</h3><div class="sec" style="margin-bottom:10px">'+(d>0?'В приложении денег меньше, чем на самом деле: возможно, не внесено пополнение или начальный остаток занижен.':'В приложении денег больше, чем на самом деле: возможно, не внесены расходы или есть дубль поступления.')+' Чтобы привести баланс к факту, выберите способ. Корректировку можно потом найти и удалить в истории.</div><button class="btn" onclick="reconApply('+d+',0)">Записать корректировку '+(d>0?"+":"")+fmt(d)+'</button><button class="btn ghost" style="margin-top:8px" onclick="reconApply('+d+',1)">Изменить начальный остаток</button><button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Не менять</button>')}
function reconApply(d,st){if(st)S.start+=d;else S.tx.push({id:Date.now()+Math.random(),t:d>0?"inc":"exp",amt:Math.abs(d),cat:d>0?"inc":othId(),note:"Корректировка баланса",ts:Date.now()});save();closeSheet();render();toast(st?"Начальный остаток изменён":"Корректировка записана")}

function frozenSum(){return (S.frozen||[]).reduce(function(a,f){return a+Math.max(f.amt-(f.back||0),0)},0)}
var FK={debt:["🤝","Дал в долг"],arrest:["⚖️","Арест приставами"],other:["🔒","Другое"]};
function fzFind(id){return S.frozen.filter(function(x){return x.id==id})[0]}
function frozen(){var fz=S.frozen||[],act=fz.filter(function(f){return !f.closed}),cl=fz.filter(function(f){return f.closed}).sort(function(a,b){return (b.cd||"")>(a.cd||"")?1:-1}),tot=frozenSum();
var h='<div class="row"><button class="ib" onclick="tab=4;render()">'+ic("l")+'</button><h1 style="margin:0;font-size:20px">Замороженные средства</h1><span style="width:38px"></span></div><div style="height:14px"></div>';
h+='<div class="sec" style="margin:0 4px 12px">Деньги, которые вы временно не можете тратить: дали в долг, арест счёта и т. п. Пока они не вернулись, сумма вычитается из общего баланса. Когда деньги вернутся, нажмите «Вернули деньги», и они снова появятся в балансе.</div>';
h+='<div class="card"><div class="sec">Сейчас заморожено</div><div class="big">'+fmt(tot)+'</div><div class="sec">Баланс с учётом заморозки: '+fmt(bal())+'</div></div><button class="btn" style="margin-bottom:14px" onclick="fzSheet(0)">+ Добавить</button>';
h+=act.length?act.map(function(f){var k=FK[f.kind]||FK.other,rem=f.amt-(f.back||0);return '<div class="card"><div class="row" style="align-items:flex-start"><div style="min-width:0"><b>'+k[0]+' '+esc(f.name)+'</b><div class="sec">'+k[1]+' · с '+fd(f.d)+'</div></div><b style="white-space:nowrap">'+fmt(rem)+'</b></div>'+(f.back>0?'<div class="sec">Вернули '+fmt(f.back)+' из '+fmt(f.amt)+'</div>':'')+(f.note?'<div class="sec" style="margin-top:4px;white-space:pre-wrap">'+esc(f.note)+'</div>':'')+'<div class="row" style="gap:8px;margin-top:10px"><button class="btn" style="padding:10px;font-size:14px" onclick="fzBackSheet('+f.id+')">Вернули деньги</button><button class="btn ghost" style="width:auto;padding:10px 16px;font-size:14px" onclick="fzSheet('+f.id+')">Изменить</button></div></div>'}).join(""):'<div class="sec" style="text-align:center;padding:16px">Замороженных сумм нет</div>';
if(cl.length)h+='<h3 style="margin:14px 4px 8px">Возвращено</h3>'+cl.slice(0,10).map(function(f){var k=FK[f.kind]||FK.other;return '<div class="card" style="opacity:.85"><div class="row"><span>'+k[0]+' '+esc(f.name)+'</span><b class="pos">'+fmt(f.amt)+'</b></div><div class="sec">Вернули '+(f.cd?fd(f.cd):"")+'</div><button class="btn ghost" style="margin-top:8px;padding:9px;font-size:13px" onclick="fzUndo('+f.id+')">Отменить возврат</button></div>'}).join("");
return h}
function fzSheet(id){var f=id?fzFind(id):null;sheet('<h3>'+(f?"Изменить":"Новая заморозка")+'</h3><div class="sec">Кому дали, кто арестовал или что это</div><input id="fzn" value="'+esc(f?f.name:"")+'" placeholder="Например, Саша или Приставы"><div class="sec">Сумма, ₽</div><input id="fza" inputmode="decimal" placeholder="0" value="'+(f?(f.amt/100).toString().replace(".",","):"")+'"><div class="sec">Тип</div><select id="fzk" style="'+SEL+'">'+Object.keys(FK).map(function(k){return '<option value="'+k+'"'+(f&&f.kind==k?" selected":"")+'>'+FK[k][0]+' '+FK[k][1]+'</option>'}).join("")+'</select><div class="sec">Дата</div><input id="fzd" type="date" value="'+(f?f.d:iso(new Date()))+'"><div class="sec">Комментарий</div><textarea id="fzt" rows="3">'+esc(f?f.note||"":"")+'</textarea><button class="btn" onclick="saveFz('+(f?f.id:0)+')">Сохранить</button>'+(f?'<button class="btn ghost" style="margin-top:8px" onclick="delFz(this,'+f.id+')">Удалить</button>':'')+'<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Отмена</button>')}
function saveFz(id){var nm=$("fzn").value.trim(),a=parse($("fza").value);if(!nm)return toast("Укажите, кто или что");if(a<=0)return toast("Введите сумму");var f=id?fzFind(id):null,o={name:nm,amt:a,kind:$("fzk").value,d:$("fzd").value||iso(new Date()),note:$("fzt").value.trim()};
if(f){Object.assign(f,o);f.closed=(f.back||0)>=f.amt}else S.frozen.push(Object.assign({id:Date.now(),back:0,closed:false,ret:[]},o));save();closeSheet();render();toast("Сохранено ✓")}
function fzBackSheet(id){var f=fzFind(id),rem=f.amt-(f.back||0);sheet('<h3>Вернули деньги</h3><div class="sec" style="margin-bottom:8px">«'+esc(f.name)+'»: заморожено '+fmt(rem)+'. Укажите, сколько вернули: всю сумму или часть. Если вернули больше (например, с процентами), лишнее запишется как доход.</div><input id="fzb" inputmode="decimal" value="'+(rem/100).toString().replace(".",",")+'"><div class="sec">Дата возврата</div><input id="fzbd" type="date" value="'+iso(new Date())+'" max="'+iso(new Date())+'"><button class="btn" onclick="fzBack('+id+')">Вернуть в баланс</button><button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Отмена</button>')}
function fzBack(id){var f=fzFind(id),v=parse($("fzb").value);if(v<=0)return toast("Введите сумму");var rem=f.amt-(f.back||0),use=Math.min(v,rem),ds=$("fzbd").value||iso(new Date()),e={d:ds,use:use};f.back=(f.back||0)+use;
if(v>rem){var t={id:Date.now()+Math.random(),t:"inc",amt:v-rem,cat:"inc",note:"Вернули сверх суммы: "+f.name,ts:new Date(ds+"T12:00:00").getTime()};S.tx.push(t);e.tx=t.id}
(f.ret=f.ret||[]).push(e);if(f.back>=f.amt){f.closed=true;f.cd=ds}save();closeSheet();render();toast("Деньги вернулись в баланс ✓")}
function fzUndo(id){var f=fzFind(id),e=(f.ret||[]).pop();if(e){f.back=Math.max((f.back||0)-e.use,0);if(e.tx)S.tx=S.tx.filter(function(t){return t.id!=e.tx})}else f.back=0;f.closed=false;delete f.cd;save();render();toast("Возврат отменён")}
function delFz(b,id){if(b.dataset.s){S.frozen=S.frozen.filter(function(f){return f.id!=id});save();closeSheet();render();toast("Удалено")}else{b.dataset.s=1;b.textContent="Нажмите ещё раз, чтобы удалить"}}

function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function mkPlan(rem,dl){var n0=new Date(),y=n0.getFullYear(),m=n0.getMonth(),d=n0.getDate(),end=new Date(dl+"T00:00"),ds=[],i=0;while(i<120){var x=new Date(y,m+i,1);x.setDate(Math.min(d,new Date(y,m+i+1,0).getDate()));if(x>=end&&i>0)break;ds.push(x);i++}var n=ds.length,per=Math.floor(rem/n);return ds.map(function(x,j){return {d:iso(x),amt:j==n-1?rem-per*(n-1):per,done:false}})}
function wsaved(){return (S.wishes||[]).reduce(function(a,w){return a+w.plan.reduce(function(b,p){return b+(p.done?p.amt:0)},0)},0)}
function wsv(w){return w.have+w.plan.reduce(function(b,p){return b+(p.done?p.amt:0)},0)}
function fd(s){return new Date(s+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"})}
function addWish(){var n=$("wn").value.trim(),t=parse($("wt").value),dl=$("wd").value,h=parse($("wh").value);if(!n||t<=0||!dl)return toast("Заполните название, сумму и срок");if(new Date(dl+"T00:00")<=new Date().setHours(0,0,0,0))return toast("Срок должен быть в будущем");var w={id:Date.now(),name:n,target:t,have:h,dl:dl,plan:mkPlan(Math.max(t-h,0),dl)};S.wishes.push(w);wadd=false;wopen=w.id;save();render()}
function editHave(id){var w=S.wishes.filter(function(x){return x.id==id})[0],v=$("eh").value;w.have=parse(v);var un=w.plan.filter(function(p){return !p.done}),dn=w.plan.reduce(function(a,p){return a+(p.done?p.amt:0)},0);if(un.length){var rem=Math.max(w.target-w.have-dn,0),per=Math.floor(rem/un.length);un.forEach(function(p,j){p.amt=j==un.length-1?rem-per*(un.length-1):per})}save();wopen=id;ehOpen=0;render()}
function delWish(id){if(confirm("Удалить желание? Отмеченные пополнения вернутся в баланс.")){S.wishes=S.wishes.filter(function(w){return w.id!=id});save();render()}}
function tog(id,i){var w=S.wishes.filter(function(x){return x.id==id})[0];w.plan[i].done=!w.plan[i].done;save();wopen=id;render();if(w.plan[i].done&&wsv(w)>=w.target)toast("Цель достигнута 🎉")}
function wishes(){var h='<div class="row"><button class="ib" onclick="tab=4;render()">'+ic("l")+'</button><h1 style="margin:0">Мои желания</h1><span style="width:38px"></span></div><div style="height:14px"></div>';
if(wadd)h+='<div class="card"><input id="wn" placeholder="Что хочу (например, Отпуск)"><input id="wt" inputmode="decimal" placeholder="Сколько нужно, ₽"><div class="sec">Срок</div><input id="wd" type="date"><input id="wh" inputmode="decimal" placeholder="Уже накоплено, ₽ (необязательно)"><button class="btn" onclick="addWish()">Рассчитать и создать</button><button class="btn ghost" style="margin-top:8px" onclick="wadd=false;render()">Отмена</button></div>';
else h+='<button class="btn" style="margin-bottom:14px" onclick="wadd=true;render()">+ Новое желание</button>';
if(!S.wishes.length)return h+'<div class="sec" style="text-align:center;padding:20px">Пока нет желаний</div>';
return h+S.wishes.map(function(w){var sv=wsv(w),p=Math.min(100,Math.round(sv/w.target*100)),nx=w.plan.filter(function(x){return !x.done})[0],open=wopen==w.id;
var c='<div class="card"><div onclick="ehOpen=0;wopen='+(open?0:w.id)+';render()"><div class="row"><b style="font-size:18px">'+esc(w.name)+'</b><span class="sec">'+p+'%</span></div><div class="sec">цель '+fmt(w.target)+' · до '+fd(w.dl)+'</div><div class="bar"><i style="width:'+(sv>0?Math.max(2,Math.min(100,sv/w.target*100)):0)+'%"></i></div><div class="row"><span class="sec">Накоплено '+fmt(sv)+'</span><span class="sec">Осталось '+fmt(Math.max(w.target-sv,0))+'</span></div>'+(w.plan.length&&sv<w.target?'<div style="margin-top:10px;font-size:20px;font-weight:700">≈ '+fmt(w.plan[0].amt)+' <span class="sec" style="font-weight:400">в месяц · '+w.plan.length+' взносов</span></div>'+(nx?'<div class="sec">Следующее: '+fd(nx.d)+' — '+fmt(nx.amt)+'</div>':''):'<div class="pos" style="margin-top:10px">Цель достигнута 🎉</div>')+'</div>';
if(open){var n=w.plan.length,cum=w.have,bw=Math.max(2,Math.min(28,Math.floor(280/n)-3)),gap=(280-bw*n)/(n+1);
c+=(ehOpen==w.id?'<div class="sec" style="margin-top:14px">Уже накоплено, ₽ — изменение повлияет на прогресс и план</div><div class="row" style="gap:8px"><input id="eh" inputmode="decimal" value="'+(w.have/100).toString().replace(".",",")+'" style="margin:0"><button class="btn" style="width:auto;padding:11px 16px;font-size:14px" onclick="editHave('+w.id+')">Сохранить</button><button class="btn ghost" style="width:auto;padding:11px 14px;font-size:14px" onclick="ehOpen=0;render()">Отмена</button></div>':'<div class="row" style="margin-top:14px"><span class="sec">Стартовая сумма: '+fmt(w.have)+'</span><button class="btn ghost" style="width:auto;padding:7px 12px;font-size:13px" onclick="ehOpen='+w.id+';render()">Изменить</button></div>');c+='<svg viewBox="0 0 300 100" width="100%" style="margin-top:14px"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C56BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><line x1="10" x2="290" y1="10" y2="10" stroke="#43C6F5" stroke-dasharray="4 4"/>'+w.plan.map(function(q,i){cum+=q.amt;var hh=Math.max(3,Math.min(1,cum/w.target)*80),fh=Math.min(Math.min(cum,sv)/w.target,1)*80,bx=10+gap*(i+1)+bw*i;return '<rect x="'+bx+'" y="'+(90-hh)+'" width="'+bw+'" height="'+hh+'" rx="3" fill="rgba(139,92,246,.18)" stroke="#8B5CF6" stroke-width="1"/>'+(fh>0.5?'<rect x="'+bx+'" y="'+(90-fh)+'" width="'+bw+'" height="'+fh+'" rx="3" fill="url(#wg)"/>':'')}).join("")+'</svg><div class="sec" style="margin:4px 0 8px">Закрашено — накоплено фактически, контур — план (пунктир — цель)</div>'+w.plan.map(function(q,i){var late=!q.done&&new Date(q.d+"T00:00")<new Date().setHours(0,0,0,0);return '<div class="row" style="padding:9px 0;border-top:1px solid var(--bd)"><span style="flex:1;color:'+(late?"var(--bad)":"var(--tx)")+'">'+fd(q.d)+(late?" · просрочено":"")+'</span><b>'+fmt(q.amt)+'</b><input type="checkbox" '+(q.done?"checked":"")+' onchange="tog('+w.id+','+i+')" style="width:26px;height:26px;margin:0;padding:0;accent-color:#8B5CF6"></div>'}).join("")+'<button class="btn ghost" style="margin-top:12px;padding:11px;font-size:14px" onclick="delWish('+w.id+')">Удалить желание</button>'}
return c+'</div>'}).join("")}
function qrDraw(svg,t){var q=qrcode(0,"M");q.addData(t);q.make();var n=q.getModuleCount(),m=3,d="",r,c;for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";var s=n+2*m;svg.setAttribute("viewBox","0 0 "+s+" "+s);svg.setAttribute("width","260");svg.setAttribute("height","260");svg.innerHTML='<rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000" shape-rendering="crispEdges"/>'}
function share(){var f=new File([JSON.stringify(S)],"finance-backup.json",{type:"application/json"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Бэкап финансов"}).catch(function(e){if(e.name!="AbortError")exp()});return}}catch(e){}exp()}
function exp(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="finance-backup.json";a.click()}
function imp(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;if(confirm("Объединить с текущими данными?\nОК — объединить, Отмена — заменить полностью")){var ids={};S.tx.forEach(function(t){ids[t.id]=1});d.tx.forEach(function(t){if(!ids[t.id])S.tx.push(t)});var cd={};S.cards.forEach(function(c){cd[c.id]=1});(d.cards||[]).forEach(function(c){if(!cd[c.id])S.cards.push(c)});var wd={};S.wishes.forEach(function(w){wd[w.id]=1});(d.wishes||[]).forEach(function(w){if(!wd[w.id])S.wishes.push(w)});Object.keys(d.mplan||{}).forEach(function(k){if(!S.mplan[k])S.mplan[k]=d.mplan[k]});if(!S.pay.length)S.pay=d.pay||[];(d.hol||[]).forEach(function(x){if(S.hol.indexOf(x)<0)S.hol.push(x)});S.paid=Object.assign({},d.paid||{},S.paid);var fzi={};S.frozen.forEach(function(f){fzi[f.id]=1});(d.frozen||[]).forEach(function(f){if(!fzi[f.id])S.frozen.push(f)});if(d.cats&&d.cats.length){S.cats=S.cats||CATS.map(function(c){return c.slice()});d.cats.forEach(function(c){if(!S.cats.some(function(x){return x[0]==c[0]}))S.cats.push(c)})}S.start=S.start||d.start||0;if(!S.salary.next&&d.salary)S.salary=d.salary}else{S=Object.assign({cards:[],wishes:[],plan:{},mplan:{},dis:{},pay:[],hol:[],paid:{},set:{},frozen:[]},d)}CATS=(S.cats&&S.cats.length)?S.cats:defCats();save();theme();render();toast("Данные добавлены ✓")}catch(e){toast("Неверный файл")}};r.readAsText(f)}
function render(){autoPay();syncNext();$("v").innerHTML=[spend,list,stats,cards,prof,wishes,incomes,planMonth,paysched,settings,frozen][tab]();$("v").style.animation="none";void $("v").offsetWidth;$("v").style.animation="";
$("nav").innerHTML=[["plus","Трата"],["list","Расходы"],["chart","Аналитика"],["card","Карты"],["user","ЛК"]].map(function(t,i){return '<button class="'+(i==(tab>=5?4:tab)?"on":"")+'" onclick="sdate=\'\';dateOpen=false;tab='+i+';render()">'+ic(t[0])+t[1]+'</button>'}).join("")}
openDB(function(){load(function(){theme();render()})});
